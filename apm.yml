name: "sdd-framework"
version: "0.3.0"
description: "Empacota o workflow Spec-Driven Development (SDD) para agentes de IA. Instala instruções automáticas por glob para specs e memory bank, comandos /criar-spec /revisar-spec /gerar-tasks /promover-adr /validar-spec, a persona @sdd, a skill sdd-workflow (com o sensor computacional sdd-validate) com cobertura universal incluindo Codex, e o hook proteger-constitution (bloqueia escrita direta em constitution.md)."

dependencies:
  apm: []
  mcp:
    - name: io.github.github/github-mcp-server
      tools: ["get_file_contents", "search_code"]
      env:
        GITHUB_TOKEN: "${GITHUB_TOKEN}"
