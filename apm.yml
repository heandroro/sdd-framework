name: "sdd-framework"
version: "0.1.0"
description: "Empacota o workflow Spec-Driven Development (SDD) para agentes de IA. Instala instruções automáticas por glob para specs e memory bank, comandos /criar-spec /revisar-spec /gerar-tasks /promover-adr, a persona @sdd e a skill sdd-workflow com cobertura universal incluindo Codex."

dependencies:
  apm: []
  mcp:
    - name: io.github.github/github-mcp-server
      tools: ["get_file_contents", "search_code"]
      env:
        GITHUB_TOKEN: "${GITHUB_TOKEN}"
